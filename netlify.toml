# El APK se descarga como app de Android y assetlinks.json permite abrir los enlaces de invitación en la app
[[headers]]
  for = "/descargas/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=PadelMetric.apk"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
