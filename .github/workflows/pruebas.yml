# Pruebas automáticas: en cada subida a main y en cada pull request se abre la app en un navegador
# sin ventana y se comprueban el partido, los enlaces, el directo, los datos, el botón atrás y el diseño.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar el navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ejecutar las pruebas
        run: npm test
